<!doctype html><html lang="en" data-root="../"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schedule · Southern Food Basket</title><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&family=Caprasimo&display=swap" rel="stylesheet">
<link rel="icon" href="../assets/img/favicon-64.png" type="image/png">
<link rel="stylesheet" href="../assets/css/tokens.css"><link rel="stylesheet" href="../assets/css/app.css"><link rel="stylesheet" href="../assets/css/portal.css">
</head>
<body data-app="portal" data-active="schedule" data-title="Schedule" data-banner data-page="schedule">
<main data-app-main>
  <div class="page-head">
    <div><h1>Schedule</h1><p class="muted" id="sched-sub"></p></div>
  </div>
  <div class="toolbar" role="group" aria-label="Choose a week">
    <button class="btn btn-ghost btn-sm" type="button" id="wk-prev">Previous week</button>
    <button class="btn btn-ghost btn-sm" type="button" id="wk-this" aria-pressed="true">This week</button>
    <button class="btn btn-ghost btn-sm" type="button" id="wk-next">Next week</button>
    <span class="week-label" id="wk-label" aria-live="polite"></span>
    <span class="spacer"></span>
    <span class="badge badge-green" id="wk-hours"></span>
  </div>
  <ol class="week" id="week" aria-label="Shifts for the chosen week"></ol>
  <p class="muted week-note" id="week-note" hidden></p>
  <div class="two-col">
    <section class="panel" aria-labelledby="h-swap">
      <div class="panel-head"><h2 id="h-swap">Swap requests</h2></div>
      <div class="panel-intro"><p class="small muted">Ask to swap an upcoming shift. Your branch manager confirms cover before anything changes.</p></div>
      <ul class="list list-actions" id="swap-shifts"></ul>
    </section>
    <section class="panel" aria-labelledby="h-myswaps">
      <div class="panel-head"><h2 id="h-myswaps">Your requests</h2></div>
      <ul class="list" id="my-swaps"></ul>
    </section>
  </div>
</main>
<script src="../data/seed.js"></script><script src="../assets/js/store.js"></script><script src="../assets/js/ui.js"></script><script src="../assets/js/portal.js"></script>
</body></html>
