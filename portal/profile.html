<!doctype html><html lang="en" data-root="../"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile · Southern Food Basket</title><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/tokens.css"><link rel="stylesheet" href="../assets/css/app.css"><link rel="stylesheet" href="../assets/css/portal.css">
</head>
<body data-app="portal" data-active="profile" data-title="Profile" data-banner data-page="profile">
<main data-app-main>
  <div class="page-head">
    <div><h1>Profile</h1><p class="muted">What we have on record for you. Ask HR to change anything you cannot edit here.</p></div>
    <button class="btn btn-ghost" type="button" id="signout"><span data-icon="logout" aria-hidden="true"></span> Sign out</button>
  </div>
  <div class="two-col">
    <div class="stack stack-lg">
      <section class="panel" aria-labelledby="h-det">
        <div class="panel-head"><h2 id="h-det">Details</h2></div>
        <div class="panel-body"><dl class="kv" id="details"></dl></div>
      </section>
      <section class="panel" aria-labelledby="h-em">
        <div class="panel-head"><h2 id="h-em">Emergency contact</h2></div>
        <form class="panel-body" id="em-form" novalidate>
          <div class="form-row">
            <div class="field"><label for="em-name">Name</label><input type="text" id="em-name" name="name" required maxlength="80" autocomplete="off"></div>
            <div class="field"><label for="em-relation">Relationship</label><input type="text" id="em-relation" name="relation" maxlength="40" autocomplete="off" placeholder="Spouse, parent, friend"></div>
          </div>
          <div class="field"><label for="em-phone">Phone</label><input type="tel" id="em-phone" name="phone" required maxlength="30" autocomplete="off" placeholder="(868) 000-0000"></div>
          <p class="error-text" id="em-error" role="alert" hidden></p>
          <div class="form-actions"><button class="btn btn-primary" type="submit">Save contact</button></div>
        </form>
      </section>
    </div>
    <div class="stack stack-lg">
      <section class="panel" aria-labelledby="h-bank">
        <div class="panel-head"><h2 id="h-bank">Bank for payroll</h2></div>
        <div class="panel-body">
          <dl class="kv" id="bank"></dl>
          <p class="hint">To change your bank details, bring a bank letter or voided cheque to HR. Bank changes are not made in the portal.</p>
        </div>
      </section>
      <section class="panel" aria-labelledby="h-id">
        <div class="panel-head"><h2 id="h-id">Identity documents</h2><a href="docs.html#documents">Manage</a></div>
        <ul class="list" id="id-docs"></ul>
      </section>
    </div>
  </div>
</main>
<script src="../data/seed.js"></script><script src="../assets/js/store.js"></script><script src="../assets/js/ui.js"></script><script src="../assets/js/portal.js"></script>
</body></html>
