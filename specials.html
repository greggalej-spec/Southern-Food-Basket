<!doctype html>
<html lang="en" data-root="./">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Try Me deals · Southern Food Basket</title>
<meta name="description" content="Southern Food Basket Try Me deals: fresh-cut veg packs, double-layer cakes, yogurts, snacks, protein snacks and body washes, with the prices as posted on the company’s Instagram. Unofficial concept by Trinovata.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1D6B35">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&family=Caprasimo&display=swap" rel="stylesheet">
<link rel="icon" href="assets/img/favicon-64.png" type="image/png"><link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/tokens.css"><link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<header data-sfb-header data-active="specials"></header>
<main id="main">

  <section class="page-hero" aria-labelledby="deals-title">
    <div class="container">
      <p class="eyebrow">1 for the price shown</p>
      <h1 id="deals-title">Try Me deals</h1>
      <p class="lede">Everything we have put up with a “Try Me” price, newest first. Pick a department, or show only the posts tagged at our Couva store.</p>
      <p class="note" data-deals-note></p>
    </div>
  </section>

  <section class="section deals-band" aria-label="Deals">
    <div class="container">
      <div class="deals-toolbar">
        <ul class="chips" data-deal-filters aria-label="Filter by department"></ul>
        <div class="filters-row">
          <p class="deals-count" data-deals-count role="status" aria-live="polite"></p>
          <label class="check" for="f-couva"><input id="f-couva" type="checkbox"> Only posts tagged Couva</label>
        </div>
      </div>
      <div class="deal-grid" data-deals-grid></div>
      <p class="note" style="margin-top:24px">All prices in Trinidad and Tobago dollars (TTD), one item each, as posted. Photos are the company’s own.</p>
    </div>
  </section>

</main>
<footer data-sfb-footer></footer>
<script src="data/seed.js"></script><script src="assets/js/store.js"></script><script src="assets/js/ui.js"></script><script src="assets/js/site.js"></script>
</body></html>
