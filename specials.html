<!doctype html>
<html lang="en" data-root="./">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>This week’s specials · Southern Food Basket</title>
<meta name="description" content="This week’s specials at Southern Food Basket, filtered by branch and department. Prices in TTD. Unofficial concept by Trinovata; demo prices.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/tokens.css"><link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<header data-sfb-header data-active="specials"></header>
<main id="main">

  <section class="page-head">
    <div class="container">
      <p class="eyebrow">Specials</p>
      <h1>This week’s specials</h1>
      <p class="lede"><span data-week-label>Thu 22 – Wed 28 Oct</span>. Pick your branch to see what is on at yours; some items are at one or two branches only.</p>
    </div>
  </section>

  <section class="section section-tight" aria-labelledby="list-title">
    <div class="container">
      <h2 id="list-title" class="visually-hidden">Specials list</h2>
      <form class="toolbar" data-specials-toolbar aria-label="Filter specials">
        <div class="field">
          <label for="f-branch">Branch</label>
          <select id="f-branch" name="branch"><option value="all">All branches</option></select>
        </div>
        <div class="field">
          <label for="f-dept">Department</label>
          <select id="f-dept" name="dept"><option value="all">All departments</option></select>
        </div>
        <button class="btn btn-ghost" type="button" data-clear hidden>Clear filters</button>
      </form>
      <p class="toolbar-meta" role="status" aria-live="polite" data-specials-count></p>
      <div class="grid specials-grid" data-specials-grid></div>
      <p class="price-note">Prices in TTD, valid this week while stocks last.</p>
    </div>
  </section>

</main>
<footer data-sfb-footer></footer>
<script src="data/seed.js"></script><script src="assets/js/store.js"></script><script src="assets/js/ui.js"></script><script src="assets/js/site.js"></script>
</body></html>
